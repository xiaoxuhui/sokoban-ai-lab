<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="套箱模式的三道入门推箱关卡。">
  <meta name="theme-color" content="#111715">
  <title>套箱模式 · 入门</title>
  <link rel="stylesheet" href="style.css?v=47">
  <link rel="stylesheet" href="box-intro.css?v=1">
  <script src="engine.js?v=43" defer></script>
  <script src="box-intro.js?v=1" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true">▦</span>套箱模式</div>
      <a class="outline docs top-link" href="./">返回推箱子实验室</a>
    </div>
  </header>
  <main class="intro-main">
    <div class="intro-heading">
      <h1>入门</h1>
      <nav class="modes intro-levels" id="intro-levels" aria-label="选择入门关卡">
        <button type="button" data-level="0">第 1 关</button>
        <button type="button" data-level="1">第 2 关</button>
        <button type="button" data-level="2">第 3 关</button>
      </nav>
    </div>
    <section class="panel intro-panel" aria-labelledby="intro-title">
      <div class="panel-heading intro-panel-heading">
        <div>
          <h2 id="intro-title"></h2>
          <p id="intro-hint" class="secondary"></p>
        </div>
        <p class="move-count intro-count" id="intro-count"></p>
      </div>
      <div class="intro-stage">
        <div id="intro-board" class="intro-board" role="img" aria-label="棋盘"></div>
      </div>
      <div class="intro-controls">
        <div class="tools-group">
          <button class="outline" id="intro-undo" aria-keyshortcuts="Z" type="button" disabled>撤销 <kbd>Z</kbd></button>
          <button class="outline" id="intro-reset" type="button">重开</button>
        </div>
        <div class="dpad" aria-label="移动">
          <button type="button" data-move="3" aria-label="向左">←</button>
          <button type="button" data-move="0" aria-label="向上">↑</button>
          <button type="button" data-move="2" aria-label="向下">↓</button>
          <button type="button" data-move="1" aria-label="向右">→</button>
        </div>
      </div>
      <div class="intro-result">
        <p id="intro-status" class="map-note" role="status"></p>
        <button class="primary" id="intro-next" type="button" hidden>下一关 →</button>
      </div>
    </section>
    <p class="intro-keyboard secondary">方向键或 WASD 移动，按 Z 撤销。</p>
  </main>
</body>
</html>
